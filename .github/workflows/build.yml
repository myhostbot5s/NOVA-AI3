name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -o "NovaAI-Android-updated.zip" -d extracted

      - name: List contents
        run: |
          find extracted -maxdepth 4
